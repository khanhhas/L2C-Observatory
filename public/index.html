<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2C Observatory HMI</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="assets/css/observatory.css">
    <style>
        /* Ép hiển thị luồng giao diện chính */
        #wrapper {
            display: flex !important;
            visibility: visible !important;
        }
    </style>
</head>
<body class="dark-theme">

    <div class="d-flex" id="wrapper">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMenu()"></div>

        <!-- SIDEBAR -->
        <div class="glass-sidebar" id="sidebar">
            <div class="sidebar-header">
                <h4><i class="fas fa-space-shuttle text-info"></i> L2C SYSTEM</h4>
                <div class="auth-role" id="authRoleBadge">Vai trò: ADMIN</div>
            </div>
            <div class="list-group list-group-flush">
                <a href="#" class="nav-link active" onclick="App.Router.navigate('dashboard')"><i class="fas fa-tachometer-alt"></i> Bảng điều khiển</a>
                <a href="#" class="nav-link" onclick="App.Router.navigate('diagnostics')"><i class="fas fa-stethoscope"></i> Chẩn đoán lỗi</a>
                <a href="#" class="nav-link" onclick="App.Router.navigate('events')"><i class="fas fa-list-alt"></i> Nhật ký sự kiện</a>
                <a href="#" class="nav-link" onclick="App.Router.navigate('maintenance')"><i class="fas fa-tools"></i> Bảo trì & Sức khoẻ</a>
                <a href="#" class="nav-link" onclick="App.Router.navigate('learning')"><i class="fas fa-brain"></i> Tự động học</a>
                <a href="#" class="nav-link" onclick="App.Router.navigate('communication')"><i class="fas fa-network-wired"></i> Giám sát kết nối</a>
                <a href="#" class="nav-link" onclick="App.Router.navigate('console')"><i class="fas fa-terminal"></i> Bảng lệnh API</a>
                <a href="system_history.php" class="nav-link" target="_blank"><i class="fas fa-microchip"></i> Lịch sử Hệ thống</a>
                <a href="history_dashboard.php" class="nav-link" target="_blank"><i class="fas fa-chart-area"></i> Lịch sử thời tiết</a>
            </div>
            <div class="sidebar-footer">
                <div id="connStatus" class="badge bg-secondary mb-2 w-100">Đang kết nối...</div>
                <button class="btn btn-sm btn-outline-danger w-100" onclick="App.Auth.logout()">Đăng xuất (Cloudflare)</button>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div id="page-content-wrapper" class="flex-grow-1">
            <nav class="navbar glass-navbar mb-4 px-4">
                <div class="d-flex justify-content-between w-100 align-items-center">
                    <div class="d-flex align-items-center">
                        <button class="btn btn-outline-info d-md-none me-3" id="menuToggle" onclick="toggleMenu()">
                            <i class="fas fa-bars"></i>
                        </button>
                        <h4 id="pageTitle" class="m-0 text-white">Bảng điều khiển chính</h4>
                    </div>
                    <div class="sys-clock" id="sysClock">--:--:--</div>
                </div>
            </nav>

            <div class="container-fluid px-4" id="mainContainer"></div>
        </div>
    </div>

    <script>
        function toggleMenu() { document.getElementById('wrapper').classList.toggle('toggled'); }
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', () => {
                    if (window.innerWidth <= 768) document.getElementById('wrapper').classList.remove('toggled');
                });
            });
        });
    </script>

    <script type="module">
        import { AppInit } from './assets/js/app.js?v=4';
        window.App = AppInit; 
        window.onload = () => AppInit.start();
    </script>
</body>
</html>
